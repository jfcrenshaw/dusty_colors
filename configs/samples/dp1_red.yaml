# Foreground restricted to the red sequence, split at rest-frame g - r = 0.5.
# Needs the pai24 catalog, which provides the absolute magnitudes the cut uses.
id: dp1_red
extends: dp1_default.yaml
catalog: configs/catalogs/rubin_dp1_pai24.yaml
selection:
  foreground_query: >-
    photoz_sigma_fzboost < 0.1 and photoz_sigma_lephare < 0.1
    and z_phot_diff < 0.1 * (1 + z_phot)
    and (absmag_g - absmag_r) > 0.5
